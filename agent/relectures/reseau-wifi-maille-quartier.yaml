    remarque: 'Étape déclarée « aucune source ouverte (étape créée, à tester) » : notée, sans effet sur le verdict. Elle réutilise la commande de l''étape 8 (s1), ce qui est exact.'
  - 'n': 10
    verdict: sans_source
    source: aucune
    passage: ''
    remarque: 'Étape déclarée « aucune source ouverte (étape créée, à tester) » : notée, sans effet sur le verdict.'

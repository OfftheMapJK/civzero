  risques (bloc secteur, toit et foudre, accès au réseau d'autrui, règles du pays pour la puissance et les canaux) viennent de la fiche, sans source; la dernière est marquée À VALIDER.
remarques: >-
  Fiche créée : les étapes 9 et 10 sont déclarées « aucune source ouverte (étape créée, à tester) », comme l'installation d'OpenWrt (étape 2), le Wi-Fi ordinaire (étape 7) et l'accès SSH (étape 3) :
  notés, verdict inchangé. L'ajout de la première relecture (SSH attribué à s2 et s1) est corrigé. Reste, sans bloquer, l'étape 1 : la Source « s1 » n'est pas limitée, alors que dessiner les maisons
  sur papier, le critère « deux routeurs qui ne peuvent pas être reliés par un câble » et « un simple point d'accès suffit » ne sont pas dans s1 (s1 dit seulement que l'itinérance entre bornes relève
  d'une autre norme). Une Source limitée à « s1 (maillage ≠ itinérance) » lèverait le doute; je n'en fais pas un ajout, car ce sont des conseils de planification, sans chiffre ni commande. Aucun
  chiffre n'est attribué à une source qui ne le dit pas. Si ça coince et Ressource : attributions exactes (s1 boucles, mesh11sd, « deux ou peut-être trois » routeurs ; s2 commande ; s3 routeur
  secondaire sans DHCP).

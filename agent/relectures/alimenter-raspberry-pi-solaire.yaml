niveaux: >-
  Niveau orange, sans variante. Dans les sources : régulateur adapté au LFP, car une tension de charge trop élevée abîme les éléments (s3, « excessive charging voltages ») ; protection de la batterie
  (s3) ; seuil de sous-tension (s1). Sans source, et dites comme telles par la fiche : court-circuit, arc, incendie, panneau sous tension, chute en hauteur, mesure à vide du convertisseur.
remarques: >-
  Fiche créée : seules les étapes 1, 3, 5, 6, 7, 9 et 10 citent une source adaptée et sont jugées. Étapes 2, 4 et 11 : déclarées « aucune source ouverte (étape créée, à tester) », notées sans effet
  sur le verdict. Étape 8 : ne cite que des fiches internes (notée sans_source, pas jugée). Numéros de source : s1 = documentation « Power supply », s2 = « Getting started », s3 = Wikipédia LFP, s4 =
  « Configuration » — les citations de la fiche correspondent aux bonnes copies. Point à signaler : « après une heure de fonctionnement » (étape 9) est un chiffre non attribué à s1 et non marqué À
  VALIDER. Aucun autre chiffre ni geste n'est attribué à une source qui ne le dit pas. Ressource : « la tension d'alimentation (5,1 V), le courant recommandé et la consommation typique de chaque
  modèle, et le seuil de l'alerte (s1 et s2) » est exact ; « Wikipédia indique la tension nominale d'une batterie LFP de quatre éléments et rappelle que la charge doit être adaptée » est exact (s3).

      Because of the nominal 3.2 V output, four cells can be connected in series for a nominal 12.8 V. ... provided the charging systems are adapted not to damage the LFP cells through excessive
      charging voltages (beyond 3.6 volts DC per cell while under charge) ... a protection system also needs to be implemented to ensure no cell can be discharged below a voltage of 2.5 V.
    remarque: >-
      Les deux points attribués à s3 (12,8 V pour quatre éléments ; chargeurs adaptés au LFP) y sont. Le conseil de vérifier que la batterie contient sa propre protection est cohérent avec s3

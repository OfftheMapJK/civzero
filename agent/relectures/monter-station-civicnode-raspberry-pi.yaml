      ... indicated by the power or status LED lighting up.
    remarque: >-
      Conforme. Deux nuances : (1) s1 réserve le cas du Raspberry Pi 5 dont l'EEPROM est réglée pour attendre le bouton ; la fiche dit « dès qu'il est alimenté » sans cette exception (omission). (2)

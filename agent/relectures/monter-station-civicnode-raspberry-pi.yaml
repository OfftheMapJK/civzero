niveaux: >-
  Niveau vert, sans variante. Les quatre risques de la section Sécurité sont dans les sources : surface métallique et court-circuit (s1, à propos du boîtier), mauvais support effacé (s1, « Exclude
  system drives » et avertissement d'effacement), coupure de courant et corruption (s3 : « power dropouts can cause storage corruption » ; s1 : arrêt sûr). Le moratoire rouge sur l'ouverture du bloc
  secteur vient de la fiche, pas des sources.
remarques: >-
  Fiche créée : seules les étapes 1 à 6 et les gestes cités des étapes 9, 10, 11, 12 sont jugés. Étapes 7 et 8 entièrement, serveur web de 9 et services de 10 : déclarés « aucune source ouverte (étape
  créée, à tester) », notés sans effet sur le verdict. Aucun chiffre ni geste attribué à une source qui ne le dit pas. Remarques : « 2,5 A » s'écrit « 2.5 A » dans s1 (même valeur). Section Ressource
  : « la copie de dossiers (source s2) » est exacte (`scp -r`) ; « signale qu'une alimentation de mauvaise qualité peut corrompre le stockage (source s3) » est dans s3 (« Low quality power supplies
  can corrupt storage »). Si ça coince : le Zero n'a qu'un port d'alimentation marqué PWR IN (s1) ; l'Overlay File System est dans les options de performance de raspi-config (s4).
verdict: conforme

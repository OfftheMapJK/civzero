niveaux: >-
  Niveau vert, sans variante. Les risques de la section Sécurité (réception seule, antenne au sol, orage, image qui ne remplace pas une alerte) ne sont tirés d'aucune des quatre copies; la fiche ne
  les leur attribue pas. Le cadre légal est marqué À VALIDER.
remarques: >-
  Fiche créée : seules les étapes 1, 5, 6, 7 et 8 citent une source adaptée et sont jugées; toutes conformes après correction. Étapes 2, 3, 4 et 9 : déclarées « aucune source ouverte (étape créée, à
  tester) », notées sans_source sans effet sur le verdict. L'écart de la première relecture (dossier de sortie dans Processing) est corrigé, de même que « démarrer la source », le réglage du
  défilement et l'ordre d'arrêt, maintenant déclarés sans source. Principe : « la plupart de ces émissions sont libres et non chiffrées » correspond à s2 (« most ») et s3 (« some »); « NOAA-19 ... mis
  hors service en 2025 » est dans s1. Ressource : la phrase sur NOAA 15 et 18 renvoie à s5 et précise que seul NOAA-19 figure dans une source adaptée : exact. Détail sans bloquer : Si ça coince écrit
  « NOAA-19, le dernier satellite à diffuser l'APT » et la Ressource « dernier satellite à porter l'APT »; s1 dit « the last NOAA satellite to carry » l'APT (le Principe garde la réserve « NOAA »).
  Aucun autre chiffre n'est attribué à une source qui ne le dit pas. Le 72 000 symboles/s reste non trouvé dans les copies, marqué À VALIDER dans la phrase.
verdict: conforme

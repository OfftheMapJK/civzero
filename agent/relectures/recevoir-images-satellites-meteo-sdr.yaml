    passage: >-
      s4 : Recorder (Live Processing) ... Source Controls: This menu lets you select what source to use (SDR or a file) and has all the options regarding the selected source. Here you set the
      frequency, samplerate, gain, etc. You can refresh the source list by pressing the 'arrow' button on the right of the combobox. s3 : ... receive pictures of the Earth transmitted using Low-rate
      picture transmission at 137.9 MHz ...
    remarque: >-
      Corrigé : « démarrer la source » est désormais déclaré « aucune source ouverte lue » dans la Source. L'onglet Recorder, le choix de la source, la fréquence, la fréquence d'échantillonnage et le
      gain sont dans s4; la flèche de rafraîchissement (Si ça coince) aussi; 137,9 MHz pour N2-4 est dans s3. 137,1 MHz vient de s5 (référence, sans copie) et est déclaré comme tel : non vérifiable

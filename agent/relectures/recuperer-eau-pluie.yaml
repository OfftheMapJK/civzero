niveaux: ''
remarques: >-
  Conventions : un ajout relevé seulement dans une ligne « Vérification » est noté ici sans changer le verdict de l'étape ; un ajout dans l'« Action » donne le verdict ajout ; une étape qui se déclare
  « sans objet » compte sans source ; un chiffre absent des copies mais marqué À VALIDER dans la même phrase est noté trouve: false, a_valider: true. Copies lisibles et complètes. ARRÊTÉ DU 12 JUILLET
  2024 (pas dans la provenance) : s1 le cite seulement par son titre, sous « Textes de loi et références » ; la copie ne dit ni ce qu'il contient, ni qu'il remplace l'arrêté de 2008. Ce que la fiche
  en tire maintenant : son titre et sa date, repris de s1, avec un renvoi à Légifrance « pour connaître les règles exactes, dont les toits exclus » ; la mention « le texte en vigueur » a été retirée.
  Rien d'autre : la note À VALIDER de l'étape 2 reconnaît qu'il n'a pas pu être ouvert. Les règles de la fiche (usages autorisés, interdiction de boire, signalisation, entretien, sanction pénale)
  viennent du résumé de s1, pas du texte de l'arrêté. L'ARRÊTÉ DU 21 AOÛT 2008 (s3, en référence, sans copie) : sa date, son abrogation « le 1er septembre 2024 » (titre de la provenance et Ressource «
  l'ancien texte, abrogé ») et l'exclusion de l'amiante-ciment et du plomb pour les usages intérieurs (note de l'étape 2) ne sont vérifiables dans aucune copie. À faire avant diffusion : ouvrir
  l'arrêté de 2024 sur Légifrance et en lire les règles de toiture. Principe : « feuilles » comme source de pollution est absent de s1 et s2 ; s1 cite les pesticides, que la fiche ne reprend pas.
  Sécurité : le risque de chute, le poids de la cuve, la pose sur un sol plat et stable et les enfants n'ont pas de source dans les copies et ne contredisent rien. Si ça coince : les conseils (avis de
  l'agence régionale de santé, descente débranchée à la première pluie, vider la cuve loin des regards d'égout, mettre la cuve à l'ombre) n'ont pas de source ; le renvoi au récupérateur avec
  branchement (déclaration en mairie) est conforme à s1.
verdict: conforme

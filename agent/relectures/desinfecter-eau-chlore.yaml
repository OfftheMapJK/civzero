fiche: desinfecter-eau-chlore
date: '2026-11-11'
modele: claude-sonnet-5-5
etapes:
  - 'n': 1
    verdict: conforme
    source: s1
    passage: >-
      Follow the instructions on the bleach label for disinfecting drinking water. If the label does not have instructions, check the "active ingredient" on the label ... concentration of sodium
      hypochlorite. ... Follow the instructions on the label or package of chlorine dioxide, chlorine, or iodine tablets or drops.
    remarque: '« sans parfum » : s1 dit « unscented household liquid chlorine bleach ».'
  - 'n': 2
    verdict: conforme
    source: s1
    passage: If the water is cloudy, first filter it through a clean cloth, paper towel, or coffee filter. Another option is to let it settle.
    remarque: ''
  - 'n': 3
    verdict: conforme
    source: s1
    passage: >-
      1 quart or liter of water ... Add 2 drops of bleach ... 0.1 mL ... 1 gallon ... 8 drops ... ½ mL ... 1% ... 1 quart or liter ... 10 drops ... ½ mL ... If the water is cloudy, murky, colored, or
      very cold, add double
    remarque: >-
      « murky » est rendu par « boueuse ». « 3,8 litres » est une conversion marquée À VALIDER. Le dosage français reste À VALIDER, sans chiffre. Les doses en cuillère et pour 5 gallons ne sont pas
      reprises.
  - 'n': 4
    verdict: conforme
    source: s1
    passage: Stir the bleach and water mixture well. Let the water stand for at least 30 minutes before you drink it.
    remarque: ''
  - 'n': 5
    verdict: conforme
    source: s1
    passage: Store the disinfected water in clean, sanitized containers with tight covers.
    remarque: « porte la date du jour » (Vérification) est absent de s1.

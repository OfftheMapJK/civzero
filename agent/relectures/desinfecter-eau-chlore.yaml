precautions_absentes: []
niveaux: ''
remarques: >-
  Conventions : un ajout relevé seulement dans une ligne « Vérification » est noté ici sans changer le verdict de l'étape ; un ajout dans l'« Action » donne le verdict ajout ; une étape qui se déclare
  « sans objet » compte sans source ; un chiffre absent des copies mais marqué À VALIDER dans la même phrase est noté trouve: false, a_valider: true. Copie s1 (CDC) lisible et complète. Sécurité : «
  ne jamais la mélanger avec un autre produit ménager » (gaz toxique), « hors de portée des enfants » et « beaucoup trop rend l'eau impropre » n'ont pas de source dans s1 ; « sans parfum ni additif »
  : s1 dit seulement « unscented ». Ces énoncés ne contredisent rien. Si ça coince : la seringue ou la paille reste sans source (marquée À VALIDER, sans chiffre) ; la consigne de doubler la dose est
  conforme à s1. Les avertissements sur l'iode, le carburant, les radiateurs et l'étiquette sont maintenant conformes à s1.
verdict: conforme

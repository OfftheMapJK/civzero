<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Antenne dipôle en V, vue de dessus — V-dipole antenna, top view (CivicNode, CC BY-SA 4.0)</title>
  <rect width="480" height="330" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- deux brins à 120° : chacun à 60° de l'axe vertical -->
    <path d="M240 210 L84 120 M240 210 L396 120" stroke-width="5"/>
    <!-- support central et câble -->
    <rect x="228" y="200" width="24" height="22" fill="#fff" stroke-width="3"/>
    <path d="M240 222 V300" stroke-width="3"/>
    <!-- arc de l'angle -->
    <path d="M197 185 A50 50 0 0 1 283 185" stroke-width="2"/>
    <!-- flèche nord -->
    <path d="M430 110 V40 M420 56 L430 38 L440 56" stroke-width="3"/>
    <!-- cote d'un brin -->
    <path d="M96 100 L246 187" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M96 100 l4 12 M96 100 l12 -2 M246 187 l-4 -12 M246 187 l-12 2" stroke-width="1.5"/>
  </g>
  <text x="430" y="30" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">N</text>
  <circle cx="330" cy="130" r="13" fill="#fff" stroke="#000" stroke-width="2"/><text x="330" y="136" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1</text> <circle cx="240" cy="160" r="13" fill="#fff" stroke="#000" stroke-width="2"/><text x="240" y="166" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2</text> <circle cx="165" cy="120" r="13" fill="#fff" stroke="#000" stroke-width="2"/><text x="165" y="126" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3</text> <circle cx="275" cy="275" r="13" fill="#fff" stroke="#000" stroke-width="2"/><text x="275" y="281" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" width="420" height="430" role="img" aria-label="Déviateur de premières eaux / First flush diverter" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Déviateur de premières eaux — First flush diverter (CivicNode, CC BY-SA 4.0)</title>
  <rect width="420" height="430" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- 1 : descente de gouttière -->
    <path d="M100 15 V120 M140 15 V105"/>
    <!-- té et tuyau vers la cuve (5) -->
    <path d="M140 105 H300 M140 145 H300"/>
    <!-- réduction vers la chambre -->
    <path d="M100 120 V165 M140 145 V165"/>
    <!-- 2 : chambre des premières eaux -->
    <path d="M100 165 L80 185 V385 H160 V185 L140 165"/>
    <!-- 6 : cuve -->
    <path d="M300 90 H400 V385 H300 Z"/>
    <path d="M300 105 V145" stroke="#fff" stroke-width="5"/>
  </g>
  <!-- eau dans la chambre et dans la cuve : hachures -->
  <g stroke="#000" stroke-width="1.5">
    <path d="M80 215 H160" stroke-width="2"/>
    <path d="M86 235 H154 M86 255 H154 M86 275 H154 M86 295 H154 M86 315 H154 M86 335 H154 M86 355 H154 M86 375 H154" stroke-dasharray="6 6"/>
    <path d="M300 300 H400" stroke-width="2"/>
    <path d="M306 320 H394 M306 340 H394 M306 360 H394 M306 378 H394" stroke-dasharray="6 6"/>
  </g>
  <!-- 3 : bille flottante -->
  <circle cx="120" cy="200" r="15" fill="#fff" stroke="#000" stroke-width="3"/>
  <!-- 4 : petit orifice de vidange, gouttes -->
  <path d="M120 385 V396" stroke="#000" stroke-width="3"/>
  <path d="M120 403 q-5 8 0 11 q5 -3 0 -11 Z" fill="#000"/>
  <!-- flèches : sens de l'eau -->
  <g fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 25 V85 M112 75 L120 87 L128 75"/>
    <path d="M165 125 H270 M258 117 L272 125 L258 133"/>
  </g>
  <!-- numéros -->
  <g font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#000">
    <g fill="#fff" stroke="#000" stroke-width="2">
      <circle cx="55" cy="55" r="14"/><circle cx="40" cy="290" r="14"/><circle cx="40" cy="200" r="14"/>
      <circle cx="55" cy="400" r="14"/><circle cx="220" cy="80" r="14"/><circle cx="350" cy="220" r="14"/>
    </g>
    <text x="55" y="61">1</text><text x="40" y="296">2</text><text x="40" y="206">3</text>
    <text x="55" y="406">4</text><text x="220" y="86">5</text><text x="350" y="226">6</text>
  </g>
  <g stroke="#000" stroke-width="1.5">
    <path d="M69 55 H98 M54 290 H78 M54 200 H103 M69 400 H112 M220 94 V103"/>
  </g>

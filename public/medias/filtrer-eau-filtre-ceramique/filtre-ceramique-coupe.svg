<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d">
  <title id="t">Filtre céramique en coupe / Ceramic filter, cross-section</title>
  <desc id="d">Coupe d'un filtre céramique à bougie : 1, l'eau clarifiée versée dans le récipient du haut ; 2, la bougie en céramique ; 3, l'eau filtrée qui goutte dans le récipient du bas ; 4, le robinet. Schéma CivicNode, CC BY-SA 4.0.</desc>
  <rect width="600" height="560" fill="#FFFFFF"/>
  <!-- eau du haut -->
  <rect x="134" y="120" width="252" height="110" fill="#C9C2B0"/>
  <!-- eau du bas -->
  <rect x="134" y="390" width="252" height="110" fill="#DCE9F2"/>
  <g fill="none" stroke="#0A0A0A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- récipient du haut -->
    <path d="M130 60 L130 260 L390 260 L390 60"/>
    <!-- couvercle -->
    <path d="M115 55 L405 55"/>
    <!-- bougie -->
    <rect x="235" y="110" width="50" height="130" rx="25" fill="#E9DDC7"/>
    <path d="M260 240 L260 300"/>
    <!-- récipient du bas -->
    <path d="M130 280 L130 520 L390 520 L390 280 L130 280"/>
    <!-- gouttes -->
    <path d="M260 320 Q268 334 268 340 A8 8 0 0 1 252 340 Q252 334 260 320 Z" fill="#DCE9F2"/>
    <path d="M260 355 Q266 366 266 370 A6 6 0 0 1 254 370 Q254 366 260 355 Z" fill="#DCE9F2"/>
    <!-- robinet -->
    <path d="M390 470 L440 470 L440 490 M440 470 L455 470"/>
    <path d="M436 498 Q440 506 440 509 A4 4 0 0 1 432 509" stroke-width="3"/>
    <!-- repères -->
    <path d="M480 150 L390 165" stroke-width="2"/>
    <path d="M480 220 L287 200" stroke-width="2"/>
    <path d="M480 360 L270 345" stroke-width="2"/>
    <path d="M500 440 L452 465" stroke-width="2"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="#0A0A0A">
    <circle cx="502" cy="150" r="20" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><text x="502" y="161" text-anchor="middle">1</text>
    <circle cx="502" cy="220" r="20" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><text x="502" y="231" text-anchor="middle">2</text>
    <circle cx="502" cy="360" r="20" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><text x="502" y="371" text-anchor="middle">3</text>
    <circle cx="522" cy="440" r="20" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/><text x="522" y="451" text-anchor="middle">4</text>
  </g>
</svg>

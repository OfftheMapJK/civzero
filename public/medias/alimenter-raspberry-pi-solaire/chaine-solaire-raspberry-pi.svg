    <path d="M215 125 V190"/>
    <rect x="205" y="134" width="20" height="16" fill="#fff"/>
    <path d="M260 225 H325 M375 225 H430"/>
    <path d="M335 225 H365" stroke-width="1.5"/>
    <path d="M520 225 H588 V130"/>
    <!-- flèches -->

    <rect x="185" y="190" width="14" height="10"/><rect x="231" y="190" width="14" height="10"/>
    <!-- 4 fusible -->
    <rect x="325" y="216" width="50" height="18"/>
    <!-- 5 convertisseur -->
    <rect x="430" y="195" width="90" height="60"/>
    <!-- 6 Raspberry Pi -->
    <rect x="550" y="80" width="75" height="50"/>
    <path d="M560 90 h12 v12 h-12 Z M600 115 h18 v10 h-18 Z" stroke-width="1.5"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

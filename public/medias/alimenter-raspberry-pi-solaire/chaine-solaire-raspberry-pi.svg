<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Du panneau au Raspberry Pi — From panel to Raspberry Pi (CivicNode, CC BY-SA 4.0)</title>
  <rect width="640" height="300" fill="#fff"/>
  <g fill="#fff" stroke="#000" stroke-width="3" stroke-linejoin="round">
    <!-- 1 panneau -->
    <path d="M20 60 L110 40 L110 130 L20 150 Z"/>
    <path d="M50 53 V143 M80 47 V137 M20 105 L110 85" stroke-width="1.5" fill="none"/>
    <!-- 2 régulateur -->
    <rect x="170" y="65" width="90" height="60"/>
    <!-- 3 batterie -->

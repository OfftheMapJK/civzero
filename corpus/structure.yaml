socles:
  lichen:
    nom:
      fr: Lichen
      en: Lichen
    domaine:
      fr: Le vivant et la régénération
      en: Living things and regeneration
    nom_explique:
      fr: Le lichen associe un champignon et une algue qui ne vivent bien qu'ensemble. Pionnier, il colonise la roche nue et fait naître le sol ; sentinelle, il disparaît quand l'air est pollué. S'adapter
        dans les interstices, en alliance avec le vivant.
      en: A lichen joins a fungus and an alga that only thrive together. A pioneer, it settles on bare rock and turns it into soil; a sentinel, it vanishes when the air is polluted. Adapting in the interstices,
        in alliance with living things.
  ambre:
    nom:
      fr: Ambre
      en: Amber
    domaine:
      fr: Énergie
      en: Energy
    nom_explique:
      fr: 'Le mot « électricité » vient du grec êlektron, l''ambre : frottée, cette résine fossile attire les petits objets. C''est la première électricité observée par les humains.'
      en: 'The word “electricity” comes from the Greek ēlektron, amber: when rubbed, this fossil resin attracts small objects. It is the first electricity humans ever observed.'
  source:
    nom:
      fr: Source
      en: Spring
    domaine:
      fr: Eau et hygiène
      en: Water and hygiene
    nom_explique:
      fr: Ce qui jaillit, se partage et se protège.
      en: What wells up, is shared, and must be protected.
  graine:
    nom:
      fr: Graine
      en: Seed
    domaine:
      fr: Alimentation
      en: Food
    nom_explique:
      fr: Semer, nourrir, conserver, transmettre. La graine contient la récolte suivante, à condition de la garder.
      en: Sow, feed, keep, pass on. A seed holds the next harvest, as long as it is kept.
  ecorce:
    nom:
      fr: Écorce
      en: Bark
    domaine:
      fr: Habitat
      en: Shelter
    nom_explique:
      fr: L'écorce protège l'arbre du froid, du chaud et parfois du feu. S'abriter, isoler, garder la chaleur ou le frais.
      en: Bark shields a tree from cold, heat and sometimes fire. Taking shelter, insulating, keeping warm or cool.
  baume:
    nom:
      fr: Baume
      en: Balm
    domaine:
      fr: Soins et entraide
      en: Care and mutual aid
    nom_explique:
      fr: 'Ce qui apaise et répare : la plante qu''on applique, le geste de l''autre. Le soin vu comme entraide et orientation vers les secours, jamais comme acte médical.'
      en: 'What soothes and mends: the plant you apply, the hand of another. Care as mutual aid and as the way to the right help, never as a medical act.'
  mycelium:
    nom:
      fr: Mycélium
      en: Mycelium
    domaine:
      fr: Réseaux et télécoms
      en: Networks
    nom_explique:
      fr: Le réseau souterrain des champignons relie les arbres d'une forêt et fait circuler eau, nutriments et signaux. Un réseau sans centre.
      en: The underground web of fungi links the trees of a forest and carries water, nutrients and signals between them. A network with no centre.
  humus:
    nom:
      fr: Humus
      en: Humus
    domaine:
      fr: Communs
      en: Commons
    nom_explique:
      fr: Le sol fertile se forme de ce que chacun dépose et nourrit tout le monde. « Humain » et « humus » partagent la même racine. S'organiser, partager, décider ensemble.
      en: Fertile soil forms from what each one leaves and feeds everyone. “Human” and “humus” share the same root. Organising, sharing, deciding together.
  pollen:
    nom:
      fr: Pollen
      en: Pollen
    domaine:
      fr: Culture et arts
      en: Culture and arts
    nom_explique:
      fr: Ce qui passe de l'un à l'autre, porté par le vent ou les insectes, presque invisible, et qui féconde. Une chanson, un récit, un savoir-faire transmis.
      en: What passes from one to another, carried by wind or insects, almost invisible, and makes things grow. A song, a story, a skill handed on.
  strate:
    nom:
      fr: Strate
      en: Strata
    domaine:
      fr: Savoirs et archive
      en: Knowledge and archive
    nom_explique:
      fr: 'Les couches de sédiments gardent la mémoire de la Terre. L''archive : les fiches, les encyclopédies, les cartes, les données.'
      en: 'Layers of sediment keep the Earth''s memory. The archive: skills, encyclopedias, maps, data.'
  spore:
    nom:
      fr: Spore
      en: Spore
    domaine:
      fr: Pistes et recherches
      en: Leads and research
    nom_explique:
      fr: 'La spore est minuscule, portée par le vent, et peut attendre longtemps le bon endroit pour germer. Ici, les pistes : des idées, des prototypes et des recherches en cours, sobres et à portée de
        main, qui ne sont pas encore des fiches. On les suit, on les teste, on rapporte ce qu''on a appris.'
      en: 'A spore is tiny, carried by the wind, and can wait a long time for the right place to sprout. Here are the leads: ideas, prototypes and ongoing research, frugal and within reach, that are not
        skills yet. Follow them, test them, report what you learned.'
    pistes: true

# English titles of the skills that are written in French but not yet open in the demo.
energie-multimetre: {titre: "Use a multimeter — voltage and continuity", temps: "an hour of practice", exige_avance: "a multimeter (salvaged or low-cost) and its battery"}
energie-fin-de-vie: {titre: "What to do with a dead battery or device", temps: "a few minutes", exige_avance: "nothing"}
telecom-partage-telephone: {titre: "Pass skills from phone to phone", temps: "a few minutes", exige_avance: "already having the skills (HTML archive or Kiwix file) on at least one phone"}
energie-bilan-papier: {titre: "Estimate your consumption and autonomy on paper", temps: "an hour", exige_avance: "paper, pencil, the labels of your devices"}
calcul-station-minipc: {titre: "Build your station on a salvaged mini-PC", temps: "a day", exige_avance: "a salvaged mini-PC or laptop, an installation USB stick, Internet access during installation"}
calcul-maj-usb: {titre: "Update the station with a USB stick", temps: "an hour", exige_avance: "a USB stick, Internet access elsewhere to download the new version"}
calcul-lire-sans-station: {titre: "Read the skills without the station", temps: "a few minutes", exige_avance: "having copied the skills archive to the device or a USB stick"}
telecom-point-acces-local: {titre: "Local Wi-Fi access point", temps: "half a day", exige_avance: "the station set up; depending on the variant, a compatible Wi-Fi card or an off-the-shelf Wi-Fi router"}
telecom-carte-hors-ligne: {titre: "Offline map of your region", temps: "an hour, with Internet", exige_avance: "Internet to download the app and the regional map"}
communs-ressources-quartier: {titre: "Map the resources of your neighbourhood", temps: "half a day of walking", exige_avance: "time to walk the neighbourhood; the offline map"}
energie-protection-12v: {titre: "Measuring and protecting a 12 V circuit — fuse and wire size", temps: "half a day in the workshop", exige_avance: "fuses and fuse holder, wire of suitable size, lugs, crimping tool, multimeter"}
energie-station-batterie: {titre: "Power the station from a 12 V battery", temps: "a day in the workshop", exige_avance: "12 V battery, suitable DC-DC converter, connector that fits the station, fuse"}
energie-recharge-solaire: {titre: "Charge a 12 V battery with a panel and a controller", temps: "one to two days in the workshop", exige_avance: "solar panel, charge controller suited to the battery, cables, fuses, multimeter"}
telecom-lora-messages: {titre: "Send text messages over LoRa radio", temps: "a day", exige_avance: "two Meshtastic-compatible LoRa modules, 868 MHz aerials, two phones, Internet for setup"}
telecom-lora-reseau: {titre: "Link several LoRa stations into a network", temps: "several weeks: sites, settings, trials", exige_avance: "at least three configured modules (previous skill), a high location, power for the fixed node"}
energie-trouver-recharge: {titre: "Find somewhere to charge your phone during an outage", accroche: "It helps you find a socket that still works nearby, with nothing but your phone and its cable.", temps: "the time it takes to get there", exige_avance: "a cable and, if possible, a mains charger; know where the town hall and shelters are"}
energie-recharge-sous-la-main: {titre: "Charge your phone from the batteries at home", accroche: "It goes through the devices at home that keep energy when the power goes out: laptop, UPS, e-bike, tool batteries.", temps: "a few minutes", exige_avance: "a USB cable; depending on the case, a charged battery device or a USB adapter for a tool battery"}
energie-panneau-usb: {titre: "Charge your phone with a small USB solar panel", accroche: "It explains how to use a folding USB solar panel, and why charging a power bank works better than charging the phone directly.", temps: "a purchase, then a sunny day to learn", exige_avance: "a folding solar panel with a USB output, a cable; ideally a power bank"}
energie-manivelle: {titre: "Charge your phone with a hand crank", accroche: "It explains what to expect from a crank radio or charger: enough for a call or a message, not a full charge.", temps: "a purchase; then available in seconds", exige_avance: "a crank radio, torch or charger with a USB output, and a cable"}
energie-dynamo-velo: {titre: "Charge your phone with a bike dynamo", accroche: "It shows how to charge a phone while riding, with a hub dynamo and a USB charger made for it, never plugging the phone straight into the dynamo.", temps: "half a day of assembly, plus ordering parts", exige_avance: "a bike with a hub dynamo (or a dynamo front wheel), a USB charger designed for dynamos, preferably with a buffer battery, and tools to remove a wheel"}
energie-generatrice-pedales: {titre: "Build a pedal generator for charging", accroche: "It describes how a bike on a stand, a salvaged motor and a 12 V battery make a small workshop power plant, to be built as a group and reviewed before any trial.", temps: "several weeks to a few months, as a group", exige_avance: "a bike and a roller trainer, a salvaged permanent-magnet DC motor, a power diode, a charge controller, a 12 V battery, fuses, cables, a 12 V to USB converter, a multimeter"}
